<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Détail de la demande | INSTRUCT'IF</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="module" src="js/detail-demande.js"></script>
    <script src="js/auth-middleware.js" type="module" defer></script>
    <script src="js/logout.js" defer></script>
    <style>
        :root {
            --bg: #f8fafc;
            --brand: #4f46e5;
            --brand-hover: #4338ca;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 260px;
            --mono: 'JetBrains Mono', monospace;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside { width: var(--sidebar-width); background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 20; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--brand); text-decoration: none; }
        nav { flex: 1; padding: 1.5rem 1rem; overflow-y: auto; }
        .nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; padding-left: 0.5rem; font-weight: 600; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 0.9375rem; font-weight: 500; transition: all 0.2s; margin-bottom: 0.25rem; }
        .nav-item:hover { background: #f1f5f9; }
        .nav-item.active { background: #eef2ff; color: var(--brand); }
        .recent-block { margin: 0 1rem 1rem; padding: 1rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; }
        .recent-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin-bottom: 0.75rem; }
        .recent-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .recent-item { display: block; text-decoration: none; color: var(--text); padding: 0.5rem; border-radius: 8px; transition: background 0.2s; }
        .recent-item:hover { background: #eef2ff; }
        .recent-item .ri-theme { font-weight: 600; font-size: 0.75rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recent-item .ri-meta { color: var(--text-muted); font-size: 0.7rem; }
        .footer { padding: 1.5rem; border-top: 1px solid var(--border); }
        .user-pill { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
        .avatar { width: 32px; height: 32px; background: #e2e8f0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-muted); }

        /* Main */
        main { flex: 1; margin-left: var(--sidebar-width); padding: 2rem 3rem; max-width: 1000px; }

        .btn-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; margin-bottom: 1rem; }
        .btn-back:hover { color: var(--brand); }

        .page-header { margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.875rem; }

        .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; }
        .card h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.125rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; text-transform: uppercase; color: var(--text-muted); }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .info-item label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; font-weight: 600; }
        .info-item div { font-weight: 600; font-size: 0.9375rem; }

        .field-label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 600; margin-top: 1.5rem; }

        .bilan-content { background: #f8fafc; border-radius: 12px; padding: 1.5rem; border-left: 4px solid var(--brand); }
        .bilan-content h3 { font-size: 0.875rem; color: var(--brand); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .bilan-content p { font-size: 0.9375rem; margin-bottom: 1.5rem; white-space: pre-line; }
        .bilan-content p:last-child { margin-bottom: 0; }

        .badge-status { padding: 2px 8px; border-radius: 4px; font-family: var(--mono); font-size: 0.75rem; font-weight: 700; }
        .badge-success { background: #ecfdf5; color: #059669; }
        .badge-danger  { background: #fef2f2; color: #dc2626; }
        .badge-warning { background: #fffbeb; color: #d97706; }

        .link-action { color: var(--brand); text-decoration: none; font-weight: 600; font-size: 0.875rem; }
        .link-action:hover { text-decoration: underline; }

        .intervenant-mini { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; padding: 1rem; background: #f1f5f9; border-radius: 12px; }
        .mini-avatar { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--brand); flex-shrink: 0; }
    </style>
</head>
<body>
    <aside>
        <div class="sidebar-header"><a href="mes-interventions.html" class="logo">INSTRUCT'IF</a></div>
        <nav id="nav"></nav>

        <div class="recent-block" id="recent-block">
            <div class="recent-title" id="recent-list-title"></div>

            <div id="recent-list" class="recent-list">—</div>
        </div>
        <div class="footer">
            <div class="user-pill">
                <div id="initials" class="avatar">—</div>
                <div id="footer-text"><div id="name" style="font-weight:600;">—</div></div>
            </div>
            <button id="logoutStaffBtn" style="display:block;background:none;border:0;cursor:pointer;margin-top:1rem;font-size:0.75rem;color:var(--brand);font-weight:600;">Déconnexion</button>
        </div>
    </aside>

    <main>
        <a href="" class="btn-back" id="backToList">← Retour à la liste</a>

        <header class="page-header">
            <h1 id="page-title">—</h1>
            <span id="page-status"></span>
        </header>

        <section class="card">
            <h2>Demande</h2>
            <div class="info-grid">
                <div class="info-item"><label>Thème</label><div id="d-topic">—</div></div>
                <div class="info-item"><label>Matière</label><div id="d-subject">—</div></div>
                <div class="info-item"><label>Élève</label><div id="d-student">—</div></div>
                <div class="info-item"></div>
                <div class="info-item"><label>Début</label><div id="d-start">—</div></div>
                <div class="info-item"><label>Fin</label><div id="d-end">—</div></div>
            </div>
            <label class="field-label">Description</label>
            <div id="d-description" style="font-style:italic;font-size:0.875rem;color:var(--text-muted);"></div>
            <label class="field-label">Lien Visio</label>
            <div id="d-visio" style="font-size:0.8125rem;color:var(--text-muted);"></div>
        </section>

        <section id="bilan-section" class="card">
            <h2>Bilan de la séance</h2>
            <div class="bilan-content">
                <h3>Résumé</h3>
                <p id="b-texte"></p>
                <div id="b-conseils-block">
                    <h3>Conseils</h3>
                    <p id="b-conseils"></p>
                </div>
            </div>
            <div class="intervenant-mini">
                <div id="i-initials" class="mini-avatar">—</div>
                <div>
                    <div id="i-name" style="font-weight:600;">—</div>
                    <div id="i-type" style="font-size:0.75rem;color:var(--text-muted);">—</div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
