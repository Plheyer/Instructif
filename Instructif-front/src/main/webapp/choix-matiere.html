<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Choisir une matière | INSTRUCT'IF</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="js/student-auth-middleware.js" defer></script>
    <script src="js/logout.js" defer></script>
    <script src="js/choose-subject.js" type="module" defer></script>
    <script src="js/side-bar.js" type="module" defer></script>
    <style>
        :root {
            --bg: #f8fafc;
            --brand: #4f46e5;
            --brand-hover: #4338ca;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --sidebar-width: 260px;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside { width: var(--sidebar-width); background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 20; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--brand); text-decoration: none; }
        nav { flex: 1; padding: 1.5rem 1rem; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 0.9375rem; font-weight: 500; transition: all 0.2s; margin-bottom: 0.25rem; }
        .nav-item:hover { background: #f1f5f9; }
        .nav-item.active { background: #eef2ff; color: var(--brand); }
        .sidebar-footer { padding: 1.5rem; border-top: 1px solid var(--border); }
        .user-pill { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
        .avatar { width: 32px; height: 32px; background: #e2e8f0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-muted); }

        /* Main Content */
        main { flex: 1; margin-left: var(--sidebar-width); padding: 2rem 3rem; }

        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; }
        .page-title h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.875rem; letter-spacing: -0.02em; }

        /* Filters */
        .filters { background: #fff; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 1rem; margin-bottom: 2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .search-box { flex: 1; position: relative; }
        .search-box input { width: 100%; padding: 0.625rem 1rem 0.625rem 2.5rem; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; }
        .search-box svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        .filter-options { display: flex; align-items: center; gap: 1rem; font-size: 0.8125rem; color: var(--text-muted); }
        .filter-options label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
        
        select { padding: 0.625rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 0.875rem; }

        /* Grid */
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .subject-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-decoration: none; color: inherit; transition: all 0.2s; display: flex; flex-direction: column; gap: 1rem; }
        .subject-card:hover { border-color: var(--brand); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transform: translateY(-2px); }

        .subject-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: #f1f5f9; }
        .subject-info h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.125rem; margin-bottom: 0.25rem; }
        .subject-info p { font-size: 0.8125rem; color: var(--text-muted); }

        .subject-footer { margin-top: auto; padding-top: 1rem; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
        .btn-choose { background: var(--brand); color: #fff; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }

        /* Demandes récentes (bloc latéral) */
        .recent-block { margin: 0 1rem 1rem; padding: 1rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; }
        .recent-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin-bottom: 0.75rem; }
        .recent-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .recent-item { display: block; text-decoration: none; color: var(--text); padding: 0.5rem; border-radius: 8px; transition: background 0.2s; }
        .recent-item:hover { background: #eef2ff; }
        .recent-item .ri-theme { font-weight: 600; font-size: 0.75rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recent-item .ri-meta { color: var(--text-muted); font-size: 0.7rem; }
    </style>
</head>
<body>
    <aside>
        <div class="sidebar-header"><a href="choix-matiere.html" class="logo">INSTRUCT'IF</a></div>
        <nav>
            <a href="choix-matiere.html" class="nav-item active">Matières</a>
            <a href="mes-demandes.html" class="nav-item">Mes demandes</a>
        </nav>
        <div class="recent-block">
            <div class="recent-title">Demandes récentes</div>
            <div class="recent-list" id="recent-list"></div>
        </div>
        <div class="sidebar-footer">
            <div class="user-pill">
                <div class="avatar" id="initials">AP</div>
                <div><div id="student-name" style="font-weight: 600;">Alice Pascal</div><div id="student-school-grade" style="font-size: 0.75rem; color: var(--text-muted);">5ème</div></div>
            </div>
            <button id="logoutStudentBtn" style="display: block; background: none; border: 0; cursor: pointer; margin-top: 1rem; font-size: 0.75rem; color: var(--brand); text-decoration: none; font-weight: 600;">Déconnexion</button>
        </div>
    </aside>

    <main>
        <header class="page-header">
            <div class="page-title">
                <h1>Quelle matière souhaites-tu travailler ?</h1>
                <p>Sélectionne une discipline pour trouver un intervenant disponible.</p>
            </div>
        </header>

        <section class="filters">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="search-bar" type="text" value="" placeholder="Rechercher une matière ou un thème...">
            </div>
            <div class="filter-options">
                <span>Rechercher dans :</span>
                <label><input id="subject-checkbox" type="checkbox" checked> les matières</label>
                <label><input id="theme-checkbox" type="checkbox" checked> les thèmes</label>
            </div>
            <select id="subject-select">
                <option>Trier par : A → Z</option>
                <option>Trier par : Z → A</option>
            </select>
        </section>

        <span id="subjects-results-number" class="match-count"></span>

        <div id="subject-grid" class="subject-grid"></div>
    </main>
</body>
</html>
